<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O quinto elemento — protótipo 3D</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: #0B1B2B; overflow: hidden; font-family: system-ui, sans-serif; color: #F2EEE3; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; outline: none; }
  .hud { z-index: 5; position: absolute; top: 10px; font-size: 13px; background: #0B1B2Bcc; padding: 6px 10px; border-radius: 8px; border: 1px solid #E8A33D55; backdrop-filter: blur(4px); }
  #help { left: 12px; }
  #where { right: 12px; font-size: 14px; }
  #card { z-index: 5; position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 20px); width: min(580px, 92%);
          background: #0f2740ee; border: 1px solid #E8A33D; border-radius: 14px; padding: 12px; display: flex; gap: 12px;
          box-shadow: 0 10px 30px #0008; opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; backdrop-filter: blur(6px); }
  #card.show { opacity: 1; transform: translate(-50%, 0); }
  #card img { width: 150px; height: 112px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  #card h3 { margin: 0 0 4px; color: #E8A33D; font-size: 17px; }
  #card p { margin: 0; font-size: 13px; line-height: 1.4; }
  /* labels drawn over the 3D picture (specs/chat-dialogues.md) */
  .sign { font: 600 12px/1.2 "Inter", system-ui, sans-serif; color: #f2eee3; white-space: nowrap; transition: opacity .3s; }
  /* room plaque: like the sign of a real building, only the name in capitals */
  .sign.room { padding: 7px 13px 8px 11px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
               background: linear-gradient(180deg, #1c2733, #0d151e); border: 1px solid #ffffff24; border-left: 3px solid #E8A33D;
               border-radius: 3px; box-shadow: 0 8px 18px #000a, inset 0 1px 0 #ffffff17; }
  /* people: a small dark name tag */
  .sign.small { padding: 3px 8px; font-size: 11px; font-weight: 500; background: #0b141ad9; border-radius: 6px; box-shadow: 0 2px 8px #0009; }
  /* ---------- start screens: language, then the case file ---------- */
  #intro { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; overflow: auto; padding: 16px; box-sizing: border-box;
           font-family: "Inter", system-ui, sans-serif; color: #F2EEE3;
           background: radial-gradient(1100px 620px at 50% 38%, rgba(18,48,74,.62), rgba(4,9,16,.97) 70%);
           backdrop-filter: blur(9px) saturate(.75); transition: opacity 1.1s ease; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .step { display: none; position: relative; }
  .step.on { display: block; animation: enter .7s cubic-bezier(.2,.7,.2,1) both; }
  .step.leaving { animation: leave .45s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateY(-12px); } }

  /* step 1: language */
  #stepLang { text-align: center; max-width: 620px; }
  .mark { width: 62px; height: 62px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center;
          border: 1px solid rgba(232,163,61,.55); box-shadow: 0 0 0 6px rgba(232,163,61,.06), 0 0 40px rgba(232,163,61,.18);
          font-family: "DM Serif Display", Georgia, serif; font-size: 30px; color: #E8A33D; }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: rgba(242,238,227,.55); }
  .title { margin: 10px 0 4px; font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: clamp(38px, 7vw, 60px); line-height: 1.05; letter-spacing: -.01em; }
  .subtitle { margin: 0; font-family: "DM Serif Display", Georgia, serif; font-style: italic; font-size: 20px; color: rgba(242,238,227,.5); }
  .rule { width: 48px; height: 1px; margin: 28px auto; background: linear-gradient(90deg, transparent, #E8A33D, transparent); }
  .prompt { margin: 0 0 16px; font-size: 13px; color: rgba(242,238,227,.65); }
  .langs { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .lang { display: flex; align-items: center; gap: 14px; width: 250px; padding: 16px 18px; text-align: left; cursor: pointer;
          font: inherit; color: inherit; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.1); border-radius: 14px;
          transition: border-color .25s, background .25s, transform .25s, box-shadow .25s; }
  .lang:hover, .lang:focus-visible { outline: none; border-color: rgba(232,163,61,.7); background: rgba(232,163,61,.08); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .lang .flag { font-size: 26px; }
  .lang b { display: block; font-weight: 600; font-size: 16px; }
  .lang small { display: block; margin-top: 2px; font-size: 12px; color: rgba(242,238,227,.55); }
  .lang .arrow { margin-left: auto; color: #E8A33D; transition: transform .25s; }
  .lang:hover .arrow, .lang:focus-visible .arrow { transform: translateX(4px); }

  /* step 2: the case file */
  #stepCase { width: min(760px, 94vw); }
  .file { background: rgba(10,22,36,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; overflow: hidden;
          box-shadow: 0 30px 80px rgba(0,0,0,.55); backdrop-filter: blur(14px); }
  .file-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.07);
              font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,238,227,.6); }
  .rec { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; box-shadow: 0 0 10px #e5484d; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .pill { margin-left: auto; padding: 3px 9px; border: 1px solid rgba(229,72,77,.6); border-radius: 999px; color: #ff8a8d; letter-spacing: .14em; }
  .clock { font-variant-numeric: tabular-nums; color: rgba(242,238,227,.45); }
  .file-body { display: grid; grid-template-columns: 230px 1fr; gap: 24px; padding: 22px; }
  @media (max-width: 640px) { .file-body { grid-template-columns: 1fr; } }
  .evidence { margin: 0; }
  .photo { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); aspect-ratio: 4 / 3; background: #0B1B2B; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.85) contrast(1.05); animation: glitch 6s infinite; }
  .photo::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  @keyframes glitch { 0%, 92%, 100% { transform: none; filter: saturate(.85) contrast(1.05); } 93% { transform: translateX(-3px); filter: hue-rotate(40deg) saturate(1.6); } 95% { transform: translateX(2px); } }
  .target { position: absolute; left: 74%; top: 16%; width: 22%; height: 70%; border: 1.5px dashed #e5484d; border-radius: 8px; animation: pulse 1.6s infinite; }
  .target::after { content: "?"; position: absolute; top: -11px; right: -9px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
                   background: #e5484d; color: #fff; font-size: 12px; font-weight: 700; }
  .evidence figcaption { margin-top: 8px; font-size: 11px; letter-spacing: .08em; color: rgba(242,238,227,.5); }
  .label { margin: 0 0 6px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #E8A33D; }
  .file h2 { margin: 0 0 12px; font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1; }
  #premise { margin: 0; min-height: 8.2em; font-size: 15px; line-height: 1.65; color: rgba(242,238,227,.88); cursor: pointer; }
  #premise .caret { display: inline-block; width: 7px; height: 1.05em; margin-left: 1px; background: #E8A33D; vertical-align: -2px; animation: pulse 1s steps(1) infinite; }
  .mission { margin-top: 16px; padding: 12px 14px; border-left: 2px solid #E8A33D; background: rgba(232,163,61,.07); border-radius: 0 8px 8px 0;
             opacity: 0; transform: translateY(6px); transition: opacity .6s, transform .6s; }
  .mission.on { opacity: 1; transform: none; }
  .mission p { margin: 0; font-size: 14px; line-height: 1.5; }
  .mission .group { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(232,163,61,.25); }
  .group-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
  .member { padding: 4px 11px; border-radius: 999px; background: rgba(242,238,227,.08); border: 1px solid rgba(242,238,227,.2); font-size: 13px; }
  .member.you { border-color: #E8A33D; color: #E8A33D; }
  .mission .group-note { font-size: 12.5px; color: #c9c3b4; font-style: italic; }
  .file-foot { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-top: 1px solid rgba(255,255,255,.07); }
  .ghost { font: inherit; font-size: 13px; color: rgba(242,238,227,.65); background: none; border: none; cursor: pointer; padding: 8px 4px; }
  .ghost:hover { color: #F2EEE3; }
  .hint { margin-left: auto; font-size: 12px; color: rgba(242,238,227,.4); }
  #accept { font: inherit; font-weight: 600; font-size: 14px; color: #0B1B2B; background: #E8A33D; border: none; border-radius: 10px; padding: 11px 20px;
            cursor: pointer; opacity: .35; pointer-events: none; transition: opacity .4s, box-shadow .25s, transform .1s; }
  #accept.ready { opacity: 1; pointer-events: auto; box-shadow: 0 0 0 0 rgba(232,163,61,.6); animation: ready 2s infinite; }
  #accept:hover { box-shadow: 0 0 24px rgba(232,163,61,.55); }
  #accept:active { transform: scale(.97); }
  #accept:focus, .lang:focus, .ghost:focus { outline: none; }
  #accept:focus-visible { outline: 2px solid #F2EEE3; outline-offset: 3px; }
  @keyframes ready { 50% { box-shadow: 0 0 0 7px rgba(232,163,61,0); } 0% { box-shadow: 0 0 0 0 rgba(232,163,61,.5); } }
</style>
</head>
<body>
<script id="data" type="application/json">__DATA__</script>
<div id="wrap">
  <div id="help" class="hud">⬆️⬇️⬅️➡️ ou WASD para andar</div>
  <div id="where" class="hud">Corredor</div>
  <div id="card"><img id="cardImg" alt=""><div><h3 id="cardTitle"></h3><p id="cardText"></p></div></div>
  <div id="intro">
    <!-- step 1: choose the language -->
    <section class="step on" id="stepLang">
      <div class="mark">V</div>
      <p class="eyebrow">Um mistério &nbsp;·&nbsp; A mystery</p>
      <h1 class="title" id="langTitle"></h1>
      <p class="subtitle" id="langSubtitle"></p>
      <div class="rule"></div>
      <p class="prompt">Escolhe a língua &nbsp;·&nbsp; Choose your language</p>
      <div class="langs">
        <button class="lang" data-lang="pt"><span class="flag">🇵🇹</span><span><b>Português</b><small>Jogar em português</small></span><span class="arrow">→</span></button>
        <button class="lang" data-lang="en"><span class="flag">🇬🇧</span><span><b>English</b><small>Play in English</small></span><span class="arrow">→</span></button>
      </div>
    </section>

    <!-- step 2: the case file -->
    <section class="step" id="stepCase">
      <div class="file">
        <div class="file-top"><span class="rec"></span><span id="caseNo"></span><span class="pill" id="stamp"></span><span class="clock">22:15</span></div>
        <div class="file-body">
          <figure class="evidence">
            <div class="photo"><img id="evidenceImg" alt=""><div class="target"></div></div>
            <figcaption id="evidenceCaption"></figcaption>
          </figure>
          <div>
            <p class="label" id="caseLabel"></p>
            <h2 id="caseTitle"></h2>
            <p id="premise"></p>
            <div class="mission" id="mission"><p class="label" id="missionLabel"></p><p id="missionText"></p>
              <div class="group"><p class="label" id="groupLabel"></p><div class="group-list" id="groupList"></div><p class="group-note" id="groupNote"></p></div></div>
          </div>
        </div>
        <div class="file-foot">
          <button class="ghost" id="back"></button>
          <span class="hint" id="skip"></span>
          <button id="accept"></button>
        </div>
      </div>
    </section>
  </div>
  <script>
  // The start screens: plain JavaScript, they work while the 3D world is still loading behind.
  (function () {
    const DATA = JSON.parse(document.getElementById("data").textContent);
    const $ = id => document.getElementById(id);
    $("langTitle").textContent = DATA.pt.intro.title;
    $("langSubtitle").textContent = DATA.en.intro.title;
    $("evidenceImg").src = DATA.images.cover || "";

    function go(from, to) {   // fade one step out and the next one in
      from.classList.add("leaving");
      setTimeout(() => { from.classList.remove("on", "leaving"); to.classList.add("on"); }, 420);
    }

    let timer, done = false, text = "";
    function finish() {
      if (done) return; done = true; clearTimeout(timer);
      $("premise").textContent = text;
      $("mission").classList.add("on"); $("skip").style.visibility = "hidden";
      $("accept").classList.add("ready"); $("accept").focus({ preventScroll: true });
    }
    function type(shown) {   // typewriter: one more letter each time
      $("premise").textContent = text.slice(0, shown);
      const caret = document.createElement("span"); caret.className = "caret"; $("premise").append(caret);
      if (shown >= text.length) return finish();
      timer = setTimeout(() => type(shown + 1), ".,;:".includes(text[shown - 1]) ? 240 : 24);
    }

    function chooseLanguage(lang) {
      window.lang = lang;
      window.dispatchEvent(new Event("language"));   // the 3D world switches its signs too
      const t = DATA[lang].intro;
      $("caseNo").textContent = t.case; $("stamp").textContent = t.stamp; $("evidenceCaption").textContent = t.evidence;
      $("caseLabel").textContent = t.case_label; $("caseTitle").textContent = t.title;
      $("missionLabel").textContent = t.mission_label; $("missionText").textContent = t.mission;
      // the four real members of the group, as small name chips (the first one is the player)
      $("groupLabel").textContent = t.group_label; $("groupNote").textContent = t.group_note;
      $("groupList").replaceChildren(...t.group.map((member, i) => {
        const chip = document.createElement("span");
        chip.className = i === 0 ? "member you" : "member";
        chip.textContent = i === 0 ? `🕵️ ${member}` : member;
        return chip;
      }));
      $("back").textContent = t.back; $("skip").textContent = t.skip; $("accept").textContent = t.button;
      text = t.premise; done = false;
      $("premise").textContent = ""; $("mission").classList.remove("on"); $("accept").classList.remove("ready"); $("skip").style.visibility = "visible";
      go($("stepLang"), $("stepCase"));
      timer = setTimeout(() => type(1), 900);
    }
    document.querySelectorAll(".lang").forEach(b => b.addEventListener("click", () => chooseLanguage(b.dataset.lang)));
    $("premise").addEventListener("click", finish);
    // Backspace also shows the whole text at once (specs/cleaner-interface.md).
    document.addEventListener("keydown", e => {
      if (e.key !== "Backspace" || done || !$("stepCase").classList.contains("on")) return;
      e.preventDefault();
      finish();
    });
    $("back").addEventListener("click", () => { clearTimeout(timer); go($("stepCase"), $("stepLang")); });
    $("accept").addEventListener("click", () => {
      if (window.campusStart) { window.campusStart(); return; }
      $("intro").classList.add("gone");
      setTimeout(() => { $("intro").style.display = "none"; }, 1200);
      window.playing = true;
      window.dispatchEvent(new Event("start-game"));
    });
  })();
  </script>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { VignetteShader } from "three/addons/shaders/VignetteShader.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const DATA = JSON.parse(document.getElementById("data").textContent);   // texts from story.py
let LANG = window.lang || "pt";
let SCENES = DATA[LANG].scenes;   // {id: {title, text}}; pictures are in DATA.images

// =====================================================================
// 1. Renderer, camera, post-processing (the "film look")
// =====================================================================
const wrap = document.getElementById("wrap");
let renderer;
// No antialias: the picture goes through the post-processing passes below, which ignore it anyway.
try { renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" }); }
catch (error) {
  window.campusRenderFailed = true;
  window.dispatchEvent(new Event("campus-renderer-failed"));
  throw error;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));   // fewer pixels to draw: the biggest saving on big screens
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;                       // cheaper than the soft version
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // realistic light response
renderer.toneMappingExposure = 0.95;
wrap.prepend(renderer.domElement);
renderer.domElement.tabIndex = 0;
const labelRenderer = new CSS2DRenderer();   // signs are HTML, drawn on top of the 3D picture
Object.assign(labelRenderer.domElement.style, { position: "absolute", top: "0", left: "0", pointerEvents: "none" });
wrap.insertBefore(labelRenderer.domElement, renderer.domElement.nextSibling);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1c2c);
scene.fog = new THREE.Fog(0x0b1c2c, 24, 58);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

// soft reflections from a virtual room, so materials look real
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// (The ambient-occlusion pass that darkened the corners was removed: it was the most expensive pass.)
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.6, 0.9);   // glow on lamps and screens
composer.addPass(bloom);
composer.addPass(new OutputPass());
const vignette = new ShaderPass(VignetteShader);
vignette.uniforms.offset.value = 0.95; vignette.uniforms.darkness.value = 1.25;
composer.addPass(vignette);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

// =====================================================================
// 2. Textures drawn in code (no image files needed)
// =====================================================================
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function canvasTexture(size, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = MAX_ANISO;
  return t;
}
const rand = (a, b) => a + Math.random() * (b - a);
function shade(hex, amount) {   // lighten (+) or darken (-) a "#rrggbb" colour
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, ((n >> s) & 255) + amount));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function speckle(g, s, count, alpha) {
  for (let i = 0; i < count; i++) {
    g.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
    g.fillRect(Math.random() * s, Math.random() * s, rand(1, 3), rand(1, 3));
  }
}
const wood = (base, rx, ry) => canvasTexture(512, (g, s) => {
  const rows = 8, h = s / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand(0, s / 2);
    while (x < s) {
      const len = rand(s * 0.4, s * 0.8);
      g.fillStyle = shade(base, rand(-18, 18) | 0);
      g.fillRect(x, r * h, len, h);
      for (let k = 0; k < 14; k++) {   // grain
        g.strokeStyle = `rgba(40,20,5,${rand(0.05, 0.18)})`; g.lineWidth = rand(0.5, 2);
        g.beginPath(); const y = r * h + rand(2, h - 2); g.moveTo(x, y);
        g.bezierCurveTo(x + len * 0.3, y + rand(-4, 4), x + len * 0.6, y + rand(-4, 4), x + len, y + rand(-3, 3)); g.stroke();
      }
      g.fillStyle = "rgba(20,10,0,0.55)"; g.fillRect(x, r * h, 2, h);
      x += len;
    }
    g.fillStyle = "rgba(20,10,0,0.6)"; g.fillRect(0, r * h, s, 2);
  }
}, rx, ry);
const marble = (a, b, rx, ry) => canvasTexture(512, (g, s) => {
  const n = 4, t = s / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const base = (i + j) % 2 ? a : b;
    g.fillStyle = shade(base, rand(-6, 6) | 0); g.fillRect(i * t, j * t, t, t);
    for (let v = 0; v < 3; v++) {   // veins
      g.strokeStyle = `rgba(255,255,255,${rand(0.05, 0.14)})`; g.lineWidth = rand(0.6, 1.8);
      g.beginPath(); g.moveTo(i * t + rand(0, t), j * t);
      g.bezierCurveTo(i * t + rand(0, t), j * t + t * 0.3, i * t + rand(0, t), j * t + t * 0.7, i * t + rand(0, t), j * t + t); g.stroke();
    }

const colliders = [];   // boxes the player cannot walk through: {minX, maxX, minZ, maxZ}
function block(x, z, w, d) { colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 }); }
function mat(color, extra = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0, envMapIntensity: 0.35 }, extra));
}
function add(mesh, x, y, z, parent = scene) {
  mesh.position.set(x, y, z);
  mesh.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  parent.add(mesh);
  return mesh;
}
// rounded box standing on the floor: y is the bottom
function rbox(w, h, d, x, y, z, material, { radius = 0.03, collide = false, parent = scene } = {}) {
  const r = Math.min(radius, w / 2, h / 2, d / 2);
  const m = add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), material), x, y + h / 2, z, parent);
  if (collide) block(x, z, w, d);
  return m;
}
function cyl(rt, rb, h, x, y, z, material, segs = 24, parent = scene) {
  return add(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), material), x, y + h / 2, z, parent);
}
function floorPlane(w, d, x, z, material, y = 0.002) {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(w, d), material);

}
function picture(w, h, x, y, z, texture, emissive = 0) {   // flat picture facing south (towards the camera)

function label(text, x, y, z, kind = "") {   // kind: "room" (a door plaque) or "small" (a name tag)

const walls = [];
function wallPiece(cx, cz, w, d) {
  const g = new THREE.Group();
  const own = [wallMaterial.clone(), trimMaterial.clone()];
  own.forEach(m => { m.transparent = true; });
  rbox(w, WALL_H, d, 0, 0, 0, own[0], { radius: 0.02, parent: g });
  rbox(w + 0.04, 0.16, d + 0.04, 0, 0, 0, own[1], { radius: 0.01, parent: g });             // skirting board
  rbox(w + 0.06, 0.06, d + 0.06, 0, WALL_H, 0, own[1], { radius: 0.01, parent: g });        // top trim
  g.position.set(cx, 0, cz); scene.add(g);
  block(cx, cz, w, d);
  walls.push({ materials: own, cx, cz, half: w / 2, horizontal: w > d, opacity: 1 });
}
function glassPiece(cx, cz, w) {   // a modern glass partition with thin aluminium frames
  const pane = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H - 0.12, 0.03), glassMaterial);
  pane.position.set(cx, WALL_H / 2, cz); pane.renderOrder = 2; scene.add(pane);
  rbox(w, 0.08, 0.1, cx, 0, cz, trimMaterial, { radius: 0.01 });
  rbox(w, 0.06, 0.1, cx, WALL_H - 0.06, cz, trimMaterial, { radius: 0.01 });
  const posts = Math.max(1, Math.round(w / 1.6));
  for (let i = 0; i <= posts; i++) rbox(0.05, WALL_H, 0.08, cx - w / 2 + (w * i) / posts, 0, cz, trimMaterial, { radius: 0.01 });
  block(cx, cz, w, WALL_T);
}
function wallX(z, x1, x2, gaps = [], glass = false) {   // horizontal wall at z, with door gaps
  let start = x1;
  for (const gx of [...gaps].sort((a, b) => a - b)) {
    const end = gx - DOOR_W / 2;
    if (end > start) glass ? glassPiece((start + end) / 2, z, end - start) : wallPiece((start + end) / 2, z, end - start, WALL_T);
    for (const side of [-1, 1]) rbox(0.12, WALL_H + 0.05, WALL_T + 0.1, gx + side * (DOOR_W / 2 - 0.06), 0, z, trimMaterial);   // door frame
    start = gx + DOOR_W / 2;
  }
  if (x2 > start) glass ? glassPiece((start + x2) / 2, z, x2 - start) : wallPiece((start + x2) / 2, z, x2 - start, WALL_T);
}
function wallZ(x, z1, z2) { wallPiece(x, (z1 + z2) / 2, WALL_T, z2 - z1); }

// Clicking: a ray from the camera through the mouse finds the object under it.
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
function spotUnder(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  let object = raycaster.intersectObjects(spotObjects, true)[0]?.object;
  while (object && !object.userData.spot) object = object.parent;   // up to the group that has the id
  return object || null;
}

// Only the LIGHT_BUDGET lamps nearest to the character are on. The number of lamps that are on never
// changes, so the shaders are not rebuilt. A lamp fades out as it gets close to being swapped, so no
// light pops on or off.
const LIGHT_BUDGET = 10;

function updateLights() {
  const px = player.position.x, pz = player.position.z;
  for (const item of lampList) item.d = Math.hypot(item.light.position.x - px, item.light.position.z - pz);
  lampList.sort((a, b) => a.d - b.d);
  const edge = lampList.length > LIGHT_BUDGET ? lampList[LIGHT_BUDGET].d : Infinity;
  // in the secret ending the lights of the auditorium flicker
  const flicker = window.campusState?.ending?.id === "fifth_element" ? 0.35 + 0.65 * Math.abs(Math.sin(performance.now() / 85)) : 1;
  lampList.forEach((item, i) => {
    const on = i < LIGHT_BUDGET;
    item.light.visible = on;
    const mood = item.zone === "aud" ? 1 + stage * 0.8 : item.zone === "corr" ? 1 - stage * 0.7 : item.zone === "stage" ? stage : 1;
    item.light.intensity = on ? item.base * mood * flicker * Math.min(1, (edge - item.d) / 4) : 0;

function animatePerson(p, t, amount, phase) {
  const s = Math.sin(phase) * 0.6 * amount;
  const { legs, arms, body, torso, head } = p.userData;
  legs[0].rotation.x = s; legs[1].rotation.x = -s;
  arms[0].rotation.x = -s * 0.8; arms[1].rotation.x = s * 0.8;
  arms[0].rotation.z = -0.05 - Math.sin(t * 1.5) * 0.02; arms[1].rotation.z = 0.05 + Math.sin(t * 1.5) * 0.02;
  body.position.y = Math.abs(Math.sin(phase)) * 0.05 * amount;
  torso.scale.set(1 + Math.sin(t * 2) * 0.01, 1, 1 + Math.sin(t * 2) * 0.01);   // breathing
  head.rotation.z = Math.sin(phase) * 0.03 * amount;
}

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let dz = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (window.campusState && (!window.playing || window.campusBusy || window.campusState.ending)) { dx = 0; dz = 0; }
  const moving = dx !== 0 || dz !== 0;
  window.campusMoving = moving;
  stage += ((currentRoom && currentRoom.id === "auditorium" ? 1 : 0) - stage) * Math.min(1, dt * 2.5);
  moveAmount += ((moving ? 1 : 0) - moveAmount) * Math.min(1, dt * 10);
  if (moving) {
    const len = Math.hypot(dx, dz); dx /= len; dz /= len;
    const nx = player.position.x + dx * SPEED * dt, nz = player.position.z + dz * SPEED * dt;
    if (!blocked(nx, player.position.z)) player.position.x = nx;   // x and z separately,
    if (!blocked(player.position.x, nz)) player.position.z = nz;   // so you slide along walls
    const target = Math.atan2(dx, dz);
    facing += Math.atan2(Math.sin(target - facing), Math.cos(target - facing)) * Math.min(1, dt * 12);
    player.rotation.y = facing;
    walk += dt * 9;
  }
  animatePerson(player, t, moveAmount, walk);
  // the torch is on while the game is played and the player wants it; the rest of the night gets a little darker
  const torchWanted = window.campusState && !window.campusState.ending && window.campusTorchOn !== false ? 1 : 0;
  torchAmount += (torchWanted - torchAmount) * Math.min(1, dt * 4);
  torch.intensity = 140 * torchAmount;
  torch.position.set(player.position.x, 1.55, player.position.z);
  torch.target.position.set(player.position.x + Math.sin(facing) * 5, 0.3, player.position.z + Math.cos(facing) * 5);
  hemi.intensity = 0.35 * (1 - 0.5 * torchAmount);
  moon.intensity = 1.1 * (1 - 0.45 * torchAmount);
  ring.position.set(player.position.x, 0.012, player.position.z);
  ring.material.opacity = 0.4 + Math.sin(t * 3) * 0.15;

  // the others turn towards you when you come close
  for (const [i, n] of npcs.entries()) {
    animatePerson(n, t + i, 0, 0);
    const ddx = player.position.x - n.position.x, ddz = player.position.z - n.position.z;
    const want = Math.hypot(ddx, ddz) < 4.5 ? Math.atan2(ddx, ddz) : n.userData.baseAngle;
    n.rotation.y += Math.atan2(Math.sin(want - n.rotation.y), Math.cos(want - n.rotation.y)) * Math.min(1, dt * 3);
  }

  // the person you can talk to: the nearest one of this room, close enough, while the character is free to move
  let near = null, nearDistance = 2.4;
  const here = window.campusState?.people;
  if (here && window.playing && !window.campusBusy && !window.campusState.ending) {
    for (const n of npcs) {
      if (!n.visible || !here.some(p => p.id === n.userData.id)) continue;
      const d = Math.hypot(player.position.x - n.position.x, player.position.z - n.position.z);
      if (d < nearDistance) { nearDistance = d; near = n.userData.id; }
    }
    // things that are used: computer 12 is the right-hand screen of the sixth desk of the lab
    for (const o of USABLE) {
      if (!here.some(p => p.id === o.id)) continue;
      const d = Math.hypot(player.position.x - o.x, player.position.z - o.z);
      if (d < nearDistance) { nearDistance = d; near = o.id; }
    }
  }
  if (near !== window.campusNear) { window.campusNear = near; window.dispatchEvent(new Event("campus-near")); }

  // walls between the camera and you become see-through
  for (const w of walls) {
    const inFront = w.test ? w.test() : w.horizontal && w.cz > player.position.z + 0.2 && w.cz - player.position.z < 8 &&
                    Math.abs(w.cx - player.position.x) < w.half + 3;
    const target = inFront ? (w.test ? 0.05 : 0.15) : 1;
    if (Math.abs(w.opacity - target) > 0.01) {
      w.opacity += (target - w.opacity) * Math.min(1, dt * 6);
      for (const m of w.materials) { m.opacity = w.opacity; m.depthWrite = w.opacity > 0.98; }
    }
  }

  // the entrance doors slide open when you are near
  const nearDoor = Math.hypot(player.position.x + 13, player.position.z) < 3.2;
  doorOpen += ((nearDoor ? 1 : 0) - doorOpen) * Math.min(1, dt * 5);
  for (const leaf of doorLeaves) leaf.position.z = leaf.userData.side * (0.65 + doorOpen * 1.25);
  doorBlock.minZ = doorOpen > 0.8 ? 99 : -1.3;   // only walkable when open

  // the sea moves
  const sp = seaGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const x = seaBase[i * 3], y = seaBase[i * 3 + 1];
    sp.array[i * 3 + 2] = Math.sin(x * 0.35 + t * 1.1) * 0.06 + Math.sin(y * 0.6 - t * 1.6) * 0.05;
  }
  sp.needsUpdate = true;
  if (frameCount++ % 4 === 0) seaGeo.computeVertexNormals();   // the slow part: only every fourth frame
  foam.material.opacity = 0.12 + Math.sin(t * 1.6) * 0.08; foam.position.z = -15.1 + Math.sin(t * 1.6) * 0.25;

  // screens flicker a little, dust drifts
  for (const [i, s] of screens.entries()) s.material.emissiveIntensity = s.userData.base * (1 + Math.sin(t * 9 + i * 3) * 0.03);
  dust.rotation.y = t * 0.01; dust.position.y = Math.sin(t * 0.3) * 0.1;

  // camera follows from above, like looking at a board
  const shift = currentRoom ? 2.2 : 0;   // inside a room, look a bit further south so the card does not cover the room
  camera.position.lerp(new THREE.Vector3(player.position.x, 10.5, player.position.z + 8.5 + shift), Math.min(1, dt * 2.5));
  lookAt.lerp(new THREE.Vector3(player.position.x, 0.8, player.position.z - 0.6 + shift), Math.min(1, dt * 4));
  camera.lookAt(lookAt);

  updateLights();
  checkEnter();
  updateInside();
  showRoom(roomAt(player.position.x, player.position.z));
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
